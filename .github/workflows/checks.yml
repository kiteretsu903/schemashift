name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
      - run: uv sync --locked --python 3.13
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pytest
      - run: uv run --locked schemashift demo
      - run: uv run --locked schemashift demo --profile cedar
      - run: uv run --locked schemashift verify
